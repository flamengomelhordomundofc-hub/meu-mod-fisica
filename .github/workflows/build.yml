name: Compilar Mod Fisica

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Baixar MDK e Compilar
        run: |
          curl -fsSL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.0/forge-1.20.1-47.4.0-mdk.zip
          mkdir -p mdk
          unzip -q mdk.zip -d mdk
          rm -rf mdk/src/main/java/com/example
          mkdir -p mdk/src/main/java/com/fisicamod
          cp FisicaMod.java mdk/src/main/java/com/fisicamod/FisicaMod.java
          sed -i 's/^mod_id=.*/mod_id=fisicamod/; s/^mod_name=.*/mod_name=Fisica Realista Mod/; s/^mod_group_id=.*/mod_group_id=com.fisicamod/; s/^mod_version=.*/mod_version=1.0.0/; s/^mod_authors=.*/mod_authors=Player/; s/^forge_version_range=.*/forge_version_range=[47,)/; s/^loader_version_range=.*/loader_version_range=[47,)/' mdk/gradle.properties
          sed -i 's/examplemod/fisicamod/g' mdk/src/main/resources/META-INF/mods.toml
          cd mdk
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Enviar JAR
        uses: actions/upload-artifact@v4
        with:
          name: fisicamod-1.20.1-forge
          path: mdk/build/libs/*.jar
